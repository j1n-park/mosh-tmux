set -g mouse on
set -g history-limit 100000
set -g automatic-rename off
set -g allow-rename off

bind-key B set-option -g status
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"
# ----- Base -----
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#c0caf5"
#set -g status-left-length 100
#set -g status-right-length 100
set -g status-left-length 0
set -g status-right-length 0
set -g status-justify centre
setw -g window-status-separator " "

# ----- Tokyo Night Night palette -----
# bg        #1a1b26
# bg_dark   #16161e
# bg_high   #292e42
# fg        #c0caf5
# muted     #565f89
# blue      #7aa2f7
# cyan      #7dcfff
# magenta   #bb9af7
# green     #9ece6a
# yellow    #e0af68
# red       #f7768e

# ----- Left: session pill -----
#set -g status-left "#[fg=#7aa2f7,bg=#1a1b26]#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26] "
set -g status-left ""

# ----- Windows -----
setw -g window-status-format "#[fg=#292e42,bg=#1a1b26]#[fg=#c0caf5,bg=#292e42] #I │ #{@last_command} #[fg=#292e42,bg=#1a1b26]"
setw -g window-status-current-format "#[fg=#bb9af7,bg=#1a1b26]#[fg=#1a1b26,bg=#bb9af7,bold] #I │ #{@last_command} #[fg=#bb9af7,bg=#1a1b26]"

#setw -g window-status-format "#[fg=#292e42,bg=#1a1b26]#[fg=#c0caf5,bg=#292e42] #W #[fg=#292e42,bg=#1a1b26]"
#setw -g window-status-current-format "#[fg=#bb9af7,bg=#1a1b26]#[fg=#1a1b26,bg=#bb9af7,bold] #W #[fg=#bb9af7,bg=#1a1b26]"

# ----- Right: rounded info pills -----
# set -g status-right "#[fg=#292e42,bg=#1a1b26]#[fg=#7dcfff,bg=#292e42] %H:%M #[fg=#292e42,bg=#1a1b26] #[fg=#9ece6a,bg=#1a1b26]#[fg=#1a1b26,bg=#9ece6a,bold] #h #[fg=#9ece6a,bg=#1a1b26]"
set -g status-right ""

# ----- Pane borders -----
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

# ----- Messages / copy mode -----
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#7aa2f7,fg=#1a1b26,bold"
