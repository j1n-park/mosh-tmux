set -g mouse on
set -g history-limit 100000
set -g automatic-rename off
set -g allow-rename off
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 10

bind-key B set-option -g status
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# ----- Base -----
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-justify centre
setw -g window-status-separator " "

# Tokyo Night: bg #1a1b26, bg_high #292e42, fg #c0caf5,
# blue #7aa2f7, cyan #7dcfff, magenta #bb9af7, green #9ece6a.

# ----- Left: session pill -----
set -g status-left "#[fg=#7aa2f7,bg=#1a1b26]#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26] "

# ----- Windows -----
setw -g window-status-format "#[fg=#292e42,bg=#1a1b26]#[fg=#c0caf5,bg=#292e42] #I │ #W #[fg=#292e42,bg=#1a1b26]"
setw -g window-status-current-format "#[fg=#bb9af7,bg=#1a1b26]#[fg=#1a1b26,bg=#bb9af7,bold] #I │ #W #[fg=#bb9af7,bg=#1a1b26]"

# ----- Right: rounded info pills -----
set -g status-right "#[fg=#292e42,bg=#1a1b26]#[fg=#7dcfff,bg=#292e42] %H:%M #[fg=#292e42,bg=#1a1b26] #[fg=#9ece6a,bg=#1a1b26]#[fg=#1a1b26,bg=#9ece6a,bold] #h #[fg=#9ece6a,bg=#1a1b26]"

# ----- Pane borders -----
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

# ----- Messages / copy mode -----
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#7aa2f7,fg=#1a1b26,bold"
